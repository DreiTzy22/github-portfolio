<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dean Andrei Tavas | Portfolio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Toast Alert Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Navigation Header -->
    <nav>
        <div class="container nav-container">
            <a onclick="showPage('home')" class="logo">
                <img id="navAvatar" class="nav-avatar" src="./e8416bed-bc43-479b-be79-efaed9ed3f8a.jpg" onerror="this.style.display='none'">
                <span>DEAN TAVAS</span>
            </a>

            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <!-- Sun Icon (shows in Dark Mode) -->
                    <svg id="sunIcon" style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.46 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"/></svg>
                    <!-- Moon Icon (shows in Light Mode) -->
                    <svg id="moonIcon" style="width:20px; height:20px; fill:currentColor; display:none;" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                </button>

                <div class="hamburger" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Open Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <ul id="navMenu">
                <li><a onclick="showPage('home')" class="active" id="nav-home">Home</a></li>
                <li><a onclick="showPage('about')" id="nav-about">About</a></li>
                <li><a onclick="showPage('skills')" id="nav-skills">Skills</a></li>
                <li><a onclick="showPage('projects')" id="nav-projects">Projects</a></li>
                <li><a onclick="showPage('contact')" id="nav-contact">Contact</a></li>
                <li><a onclick="showPage('messages')" id="nav-messages">Inbox</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container">
        <!-- HOME PAGE -->
        <section id="home" class="page active"></section>

        <!-- ABOUT PAGE -->
        <section id="about" class="page"></section>

        <!-- SKILLS PAGE -->
        <section id="skills" class="page"></section>

        <!-- PROJECTS PAGE -->
        <section id="projects" class="page"></section>

        <!-- CONTACT PAGE -->
        <section id="contact" class="page"></section>

        <!-- INBOX PAGE -->
        <section id="messages" class="page"></section>
    </main>

    <!-- Client Script -->
    <script src="./js/app.js"></script>
</body>
</html>
